<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071016">
<title>AngelLog Cloud</title><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AngelLog">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#071016;--panel:#0e1a21;--line:#263c47;--text:#eef7f8;--muted:#91a8b1;--green:#4ac391;--red:#df7777}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0b1921,#071016);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;min-height:100vh}header{position:sticky;top:0;z-index:900;background:#071016ee;border-bottom:1px solid var(--line)}.top{max-width:1100px;margin:auto;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:20px}.small,.muted{color:var(--muted);font-size:12px}main{max-width:1100px;margin:auto;padding:18px 16px 90px}.panel{background:#102029;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}button{border:0;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#04120d}.secondary{background:#1b303a;color:var(--text);border:1px solid #33505d}.danger{background:#3b2227;color:#ffc3c8}.tab{white-space:nowrap;background:#14252e;color:#d7e5e9;border:1px solid var(--line)}.tab.active{background:var(--green);color:#04120d}.section{display:none}.section.active{display:block}label{display:block;margin:9px 0 5px;font-size:12px;color:#b8c8ce}input,select,textarea{width:100%;padding:10px 11px;border-radius:10px;border:1px solid #2d4652;background:#081319;color:var(--text)}textarea{min-height:78px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.list{display:grid;gap:9px}.item,.info,.result{background:#0b171d;border:1px solid var(--line);border-radius:13px;padding:11px}.result{cursor:pointer}.badge{display:inline-block;padding:4px 7px;border:1px solid #365763;border-radius:999px;font-size:11px;margin:3px 4px 0 0}#map{height:480px;border-radius:14px}.hidden{display:none!important}.ok{color:#83e0bb}.warn{color:#e2bd65}@media(max-width:760px){.grid,.formgrid{grid-template-columns:1fr}.tabs{display:grid;grid-template-columns:1fr 1fr}#map{height:390px}}
</style></head>
<body><header><div class="top"><div class="brand">🎣 AngelLog</div><div class="small">v4 Cloud</div></div></header><main>
<div class="panel"><h2 style="margin-top:0">☁ AngelLog synchronisieren</h2><div id="loggedOut"><div class="formgrid"><div><label>E-Mail</label><input id="email" type="email"></div><div><label>Passwort</label><input id="password" type="password" placeholder="mind. 6 Zeichen"></div></div><div class="buttons"><button class="primary" onclick="login()">Anmelden</button><button class="secondary" onclick="registerUser()">Registrieren</button></div></div><div id="loggedIn" class="hidden"><span class="badge">Cloud aktiv</span> <span id="userEmail" class="small"></span><div class="buttons"><button class="secondary" onclick="syncAll()">Synchronisieren</button><button class="danger" onclick="logout()">Abmelden</button></div></div><div id="msg" class="small" style="margin-top:8px"></div></div>
<div class="tabs"><button class="tab active" data-tab="search" onclick="show('search')">🔎 Gewässer</button><button class="tab" data-tab="mapsec" onclick="show('mapsec');initMap()">🗺 Karte</button><button class="tab" data-tab="spots" onclick="show('spots')">📍 Spots</button><button class="tab" data-tab="catches" onclick="show('catches')">🐟 Fangbuch</button></div>
<section id="search" class="section active"><div class="grid"><div class="panel"><h2>Gewässer suchen</h2><div class="formgrid"><input id="waterSearch" placeholder="z. B. Schwielochsee, Oder"><button class="primary" onclick="searchWater()">Suchen</button></div><div id="results" class="list" style="margin-top:10px"></div></div><div class="panel"><h2>Ausgewählt</h2><div id="selectedInfo" class="info">Noch nichts ausgewählt.</div><div class="buttons"><button class="primary" onclick="prefillSpot()">Als Spot speichern</button></div></div></div></section>
<section id="mapsec" class="section"><div class="panel"><div class="buttons"><button class="secondary" onclick="locateMe()">📡 Mein Standort</button></div><div id="map"></div></div></section>
<section id="spots" class="section"><div class="grid"><div class="panel"><h2>Spot speichern</h2><form id="spotForm"><label>Name *</label><input id="spotName" required><div class="formgrid"><div><label>Breitengrad *</label><input id="spotLat" required></div><div><label>Längengrad *</label><input id="spotLng" required></div></div><label>Gewässertyp</label><select id="waterType"><option>See</option><option>Fluss</option><option>Kanal</option><option>Teich</option><option>Sonstige</option></select><label>DAV/LAV-Status</label><select id="davStatus"><option value="unbekannt">Unbekannt</option><option value="lavb">LAVB / Verbandsgewässer</option><option value="vertrag">Verbandsvertragsgewässer</option><option value="privat">Privat / anderes</option></select><label>Gewässernummer</label><input id="waterNumber"><label>Notizen</label><textarea id="spotNotes"></textarea><div class="buttons"><button class="primary">Speichern</button></div></form></div><div class="panel"><h2>Meine Spots</h2><div id="spotList" class="list"></div></div></div></section>
<section id="catches" class="section"><div class="grid"><div class="panel"><h2>Fang speichern</h2><form id="catchForm"><div class="formgrid"><div><label>Fischart *</label><select id="species" required><option value="">Wählen</option><option>Wels</option><option>Hecht</option><option>Zander</option><option>Barsch</option><option>Karpfen</option><option>Forelle</option><option>Aal</option><option>Sonstige</option></select></div><div><label>Datum *</label><input id="catchDate" type="date" required></div><div><label>Länge cm</label><input id="length" type="number" step="0.1"></div><div><label>Gewicht kg</label><input id="weight" type="number" step="0.01"></div><div><label>Köder</label><input id="bait"></div><div><label>Methode</label><select id="method"><option>Spinnfischen</option><option>Vertikalangeln</option><option>Livescope</option><option>Ansitz</option><option>Sonstige</option></select></div></div><label>Gewässer</label><input id="catchWater"><label>Notizen</label><textarea id="catchNotes"></textarea><div class="buttons"><button class="primary">Fang speichern</button></div></form></div><div class="panel"><h2>Meine Fänge</h2><div id="catchList" class="list"></div></div></div></section>
</main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=id=>document.getElementById(id),sb=supabase.createClient('https://ldaymcotyifqhevbhhef.supabase.co','sb_publishable_8hCoKuU_ZFMmek5RdTRPQg_UeVBe_Jl');let user=null,spots=[],catches=[],selected=null,map,markers=[];$('catchDate').value=new Date().toISOString().slice(0,10);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function show(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));}function message(t,bad=false){$('msg').textContent=t;$('msg').className='small '+(bad?'warn':'ok')}
async function registerUser(){const e=$('email').value.trim(),p=$('password').value;if(!e||p.length<6)return message('Bitte E-Mail und mindestens 6 Zeichen Passwort eingeben.',true);const {data,error}=await sb.auth.signUp({email:e,password:p});if(error)return message(error.message,true);message(data.session?'Registrierung erfolgreich.':'Registriert. Bitte E-Mail bestätigen, falls verlangt.');}
async function login(){const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return message(error.message,true);user=data.user;ui();await syncAll();message('Angemeldet und synchronisiert.')}async function logout(){await sb.auth.signOut();user=null;ui();message('Abgemeldet.')}function ui(){const on=!!user;$('loggedOut').classList.toggle('hidden',on);$('loggedIn').classList.toggle('hidden',!on);$('userEmail').textContent=user?.email||'';}
async function syncAll(){if(!user)return;const [s,c]=await Promise.all([sb.from('angler_spots').select('*').order('created_at',{ascending:false}),sb.from('catches').select('*').order('caught_on',{ascending:false})]);if(s.error||c.error)return message((s.error||c.error).message,true);spots=s.data||[];catches=c.data||[];renderSpots();renderCatches();renderMarkers();}
async function searchWater(){const q=$('waterSearch').value.trim();if(!q)return;const r=await fetch('https://photon.komoot.io/api/?limit=8&lang=de&q='+encodeURIComponent(q));const d=await r.json();window.fs=d.features||[];$('results').innerHTML=window.fs.map((f,i)=>{const p=f.properties||{};return `<div class="result" onclick="selectWater(${i})"><b>${esc(p.name||q)}</b><div class="small">${esc([p.city,p.state,p.country].filter(Boolean).join(', '))}</div></div>`}).join('')||'<div class="info">Kein Treffer.</div>'}function selectWater(i){const f=window.fs[i],p=f.properties||{},c=f.geometry.coordinates;selected={name:p.name||$('waterSearch').value,lat:c[1],lng:c[0]};$('selectedInfo').innerHTML=`<b>${esc(selected.name)}</b><br>${selected.lat.toFixed(5)}, ${selected.lng.toFixed(5)}`;show('mapsec');setTimeout(()=>{initMap();map.setView([selected.lat,selected.lng],13);L.marker([selected.lat,selected.lng]).addTo(map).bindPopup(esc(selected.name)).openPopup()},100)}function prefillSpot(){if(!selected)return message('Bitte zuerst ein Gewässer auswählen.',true);$('spotName').value=selected.name;$('spotLat').value=selected.lat.toFixed(6);$('spotLng').value=selected.lng.toFixed(6);show('spots')}
function initMap(){if(!map){map=L.map('map').setView([52.52,13.405],6);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map)}setTimeout(()=>map.invalidateSize(),50);renderMarkers()}function renderMarkers(){if(!map)return;markers.forEach(m=>m.remove());markers=[];spots.forEach(s=>markers.push(L.marker([s.latitude,s.longitude]).addTo(map).bindPopup(`<b>${esc(s.name)}</b>`)))}function locateMe(){navigator.geolocation?.getCurrentPosition(p=>{initMap();map.setView([p.coords.latitude,p.coords.longitude],14)})}
$('spotForm').addEventListener('submit',async e=>{e.preventDefault();if(!user)return message('Bitte zuerst anmelden.',true);const {error}=await sb.from('angler_spots').insert({user_id:user.id,name:$('spotName').value,water_type:$('waterType').value,latitude:+$('spotLat').value,longitude:+$('spotLng').value,dav_status:$('davStatus').value,water_number:$('waterNumber').value||null,notes:$('spotNotes').value||null});if(error)return message(error.message,true);e.target.reset();await syncAll();message('Spot gespeichert.')});async function deleteSpot(id){const {error}=await sb.from('angler_spots').delete().eq('id',id);if(error)return message(error.message,true);await syncAll()}function renderSpots(){$('spotList').innerHTML=spots.map(s=>`<div class="item"><b>${esc(s.name)}</b><div><span class="badge">${esc(s.water_type||'')}</span><span class="badge">${esc(s.dav_status||'unbekannt')}</span></div>${s.notes?`<p class="muted">${esc(s.notes)}</p>`:''}<button class="danger" onclick="deleteSpot('${s.id}')">Löschen</button></div>`).join('')||'<div class="info">Noch keine Spots.</div>'}
$('catchForm').addEventListener('submit',async e=>{e.preventDefault();if(!user)return message('Bitte zuerst anmelden.',true);const {error}=await sb.from('catches').insert({user_id:user.id,species:$('species').value,caught_on:$('catchDate').value,length_cm:$('length').value||null,weight_kg:$('weight').value||null,bait:$('bait').value||null,method:$('method').value||null,water_name:$('catchWater').value||null,notes:$('catchNotes').value||null});if(error)return message(error.message,true);e.target.reset();$('catchDate').value=new Date().toISOString().slice(0,10);await syncAll();message('Fang gespeichert.')});async function deleteCatch(id){const {error}=await sb.from('catches').delete().eq('id',id);if(error)return message(error.message,true);await syncAll()}function renderCatches(){$('catchList').innerHTML=catches.map(c=>`<div class="item"><b>🐟 ${esc(c.species)}</b><div><span class="badge">${esc(c.caught_on)}</span>${c.length_cm?`<span class="badge">${esc(c.length_cm)} cm</span>`:''}${c.weight_kg?`<span class="badge">${esc(c.weight_kg)} kg</span>`:''}</div>${c.water_name?`<p class="muted">${esc(c.water_name)}</p>`:''}<button class="danger" onclick="deleteCatch('${c.id}')">Löschen</button></div>`).join('')||'<div class="info">Noch keine Fänge.</div>'}
(async()=>{const {data:{session}}=await sb.auth.getSession();user=session?.user||null;ui();if(user)await syncAll();})();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
